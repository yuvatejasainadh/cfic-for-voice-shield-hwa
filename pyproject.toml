[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cfic-voiceshield-hackversion"
version = "0.2.0"
description = "CloudForge Intelligence Core (CFIC) x VoiceShield HackVersion (HYBRID Architecture)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "python-multipart>=0.0.9"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6"
]

[tool.pytest.ini_options]
testpaths = ["api-gateway/tests"]
pythonpath = [".", "api-gateway"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
