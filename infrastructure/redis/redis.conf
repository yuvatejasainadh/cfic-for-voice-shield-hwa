# CFIC Infrastructure - Redis Configuration
# Used for distributed sliding-window rate limiting & job state caching

bind 0.0.0.0
port 6379
protected-mode yes
timeout 0
tcp-keepalive 300
daemonize no
supervised no
loglevel notice
databases 16
maxmemory 512mb
maxmemory-policy allkeys-lru
save 900 1
save 300 10
save 60 10000
